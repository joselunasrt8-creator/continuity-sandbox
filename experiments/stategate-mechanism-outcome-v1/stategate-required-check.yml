name: StateGate required check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  stategate:
    name: stategate
    runs-on: ubuntu-24.04
    steps:
      - name: Require frozen expected diff identity
        env:
          EXPECTED_DIFF_HASH: ${{ vars.EXPECTED_DIFF_HASH }}
        run: |
          [[ "$EXPECTED_DIFF_HASH" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'EXPECTED_DIFF_HASH is missing or malformed' >&2; exit 1; }
      - name: Validate exact PR object
        uses: joselunasrt8-creator/stategate@dd6a607533b0c5c31eb99840e39d0a443998541a
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          actor: ${{ github.event.pull_request.user.login }}
          require-review-approval: 'true'
          minimum-approvals: '1'
          expected-diff-hash: ${{ vars.EXPECTED_DIFF_HASH }}
